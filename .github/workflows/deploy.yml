name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP_DIR=/root/qdii-quota-radar
            OLD_DIR=/root/alipay-nasdaq-fund-monitor
            REPO_URL=https://github.com/hangliuc/qdii-quota-radar.git

            # 一次性迁移：项目改名前的旧目录整体搬到新路径
            # 先停掉旧容器（旧 compose 的 container_name 与新的不同，
            # 不停会残留一个实例继续跑 cron，导致飞书重复推送）
            if [ ! -d "$APP_DIR" ] && [ -d "$OLD_DIR" ]; then
              echo "检测到旧目录 $OLD_DIR，开始迁移到 $APP_DIR"
              cd "$OLD_DIR" && docker compose down || true
              mv "$OLD_DIR" "$APP_DIR"
            fi

            # 首次部署：clone
            if [ ! -d "$APP_DIR" ]; then
              git clone $REPO_URL $APP_DIR
            fi

            cd $APP_DIR
            # 改名后旧目录里的 remote 仍指向旧地址，这里统一纠正
            git remote set-url origin $REPO_URL
            git fetch origin main
            git reset --hard origin/main

            # 写入 .env（从 GitHub Secrets 注入，不进 git）
            cat > .env << 'ENVEOF'
            FEISHU_WEBHOOK=${{ secrets.FEISHU_WEBHOOK }}
            IMAGE_BASE_URL=http://${{ secrets.SERVER_HOST }}:8900
            ENVEOF
            # 去掉行首空格
            sed -i 's/^            //' .env

            # 重建并启动
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            echo "✅ 部署完成"

            # ---- 部署自检 ----
            sleep 5
            docker compose ps

            # 历史数据是否还在（改名迁移时最容易丢的东西）
            if [ -f data/history.json ]; then
              echo "✅ history.json 存在（$(wc -c < data/history.json) 字节）"
            else
              echo "⚠️  history.json 不存在，额度变动检测首次运行会失效"
            fi

            # 卡片图能否通过 nginx 访问（飞书按钮链接指向这里）
            LATEST=$(ls -t data/cards/*.png 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              NAME=$(basename "$LATEST")
              CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8900/$NAME")
              if [ "$CODE" = "200" ]; then
                echo "✅ nginx 可访问卡片图：$NAME"
              else
                echo "❌ nginx 返回 $CODE，卡片图无法访问：$NAME"
                exit 1
              fi
            else
              echo "ℹ️  data/cards/ 下暂无卡片图，跳过 nginx 检查"
            fi
